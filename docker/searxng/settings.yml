use_default_settings: true
general:
  debug: false
  instance_name: "UIE-SearXNG"
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "uie-searxng-in-docker-secret-key-change-in-prod"
  limiter: false
  image_proxy: false
ui:
  static_use_hash: true
  default_locale: "en"
  theme_args:
    simple_style: "dark"
